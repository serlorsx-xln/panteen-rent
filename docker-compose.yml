# Panteen Rent on Docker / Coolify: web (PHP + Apache) and db (MariaDB). Set the variables in Coolify's Environment tab.
services:
  web:
    build: .
    restart: unless-stopped
    environment:
      PANTEEN_APP_ENV: production
      PANTEEN_APP_URL: ${PANTEEN_APP_URL:-}
      PANTEEN_APP_KEY: ${PANTEEN_APP_KEY:?set PANTEEN_APP_KEY to a long random string}
      PANTEEN_DB_HOST: db
      PANTEEN_DB_NAME: panteen_rent
      PANTEEN_DB_USER: panteen
      PANTEEN_DB_PASS: ${PANTEEN_DB_PASS:?set PANTEEN_DB_PASS}
      PANTEEN_MAIL_DRIVER: ${PANTEEN_MAIL_DRIVER:-log}
      PANTEEN_SEED: ${PANTEEN_SEED:-demo}
    volumes:
      - storage:/var/www/panteen/storage
      - media:/var/www/panteen/public/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "80"
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: panteen_rent
      MARIADB_USER: panteen
      MARIADB_PASSWORD: ${PANTEEN_DB_PASS:?set PANTEEN_DB_PASS}
      MARIADB_ROOT_PASSWORD: ${PANTEEN_DB_ROOT_PASS:?set PANTEEN_DB_ROOT_PASS}
      MARIADB_CHARACTER_SET_SERVER: utf8mb4
      MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Bangkok
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+07:00"]
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  storage:
  media:
  db:
